<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registro | Perforaciones Palacios</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            background:
                linear-gradient(
                    rgba(9,48,62,0.82),
                    rgba(9,48,62,0.82)
                ),
                url("imagenes/imagenaforo.jpg")
                center/cover no-repeat;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;
        }

        /* =========================
           CONTENEDOR (Aumentamos max-width a 550px para 2 columnas)
        ========================= */

        .register-container {
            width: 100%;
            max-width: 550px;

            background: white;

            padding: 25px 30px;

            border-radius: 15px;

            box-shadow:
                0 20px 50px rgba(0,0,0,0.25);
        }

        /* =========================
           ENCABEZADO
        ========================= */

        .logo {
            text-align: center;

            font-size: 22px;

            font-weight: bold;

            color: #155e75;

            margin-bottom: 4px;
        }

        .logo span {
            color: #0ea5e9;
        }

        .subtitle {
            text-align: center;

            color: #607d8b;

            font-size: 13px;

            margin-bottom: 15px;
        }

        h1 {
            text-align: center;

            color: #123b4d;

            font-size: 22px;

            margin-bottom: 15px;
        }

        /* =========================
           FORMULARIO EN GRID (2 COLUMNAS)
        ========================= */

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .form-group {
            margin-bottom: 0;
        }

        /* Hace que el correo ocupe todo el ancho si es necesario */
        .full-width {
            grid-column: span 2;
        }

        label {
            display: block;

            margin-bottom: 4px;

            color: #183b4e;

            font-size: 13px;

            font-weight: bold;
        }

        input {
            width: 100%;

            padding: 10px 12px;

            border: 1px solid #d6e4e9;

            border-radius: 7px;

            outline: none;

            font-size: 14px;

            color: #183b4e;

            transition: 0.3s;
        }

        input:focus {
            border-color: #0ea5e9;

            box-shadow:
                0 0 0 3px rgba(14,165,233,0.12);
        }

        /* =========================
           BOTÓN
        ========================= */

        .register-button {
            width: 100%;

            padding: 12px;

            margin-top: 15px;

            border: none;

            border-radius: 8px;

            background: #155e75;

            color: white;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }

        .register-button:hover {
            background: #0ea5e9;

            transform: translateY(-2px);
        }

        /* =========================
           ENLACES
        ========================= */

        .links {
            text-align: center;

            margin-top: 15px;

            font-size: 13px;

            color: #607d8b;
        }

        .links a {
            color: #0369a1;

            font-weight: bold;

            text-decoration: none;
        }

        .links a:hover {
            text-decoration: underline;
        }

        .back {
            display: block;

            text-align: center;

            margin-top: 12px;

            color: #607d8b;

            text-decoration: none;

            font-size: 12px;
        }

        .back:hover {
            color: #0ea5e9;
        }

        /* =========================
           RESPONSIVE (A 1 Columna en Celulares)
        ========================= */

        @media (max-width: 520px) {

            body {
                padding: 15px;
            }

            .register-container {
                padding: 20px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .full-width {
                grid-column: span 1;
            }

        }

    </style>

</head>


<body>


    <div class="register-container">


        <div class="logo">
            Perforaciones <span>Palacios</span>
        </div>

        <div class="subtitle">
            Soluciones profesionales en perforación de pozos
        </div>


        <h1>
            Crear cuenta
        </h1>


        <!-- =========================
             FORMULARIO DE REGISTRO
        ========================= -->

        <form id="registerForm" novalidate>

            <div class="form-grid">

                <div class="form-group">
                    <label for="name">
                        Nombre completo
                    </label>
                    <input
                        type="text"
                        id="name"
                        placeholder="Ingresa tu nombre"
                    >
                </div>


                <div class="form-group">
                    <label for="phone">
                        Teléfono
                    </label>
                    <input
                        type="tel"
                        id="phone"
                        placeholder="Ingresa tu teléfono"
                    >
                </div>


                <div class="form-group full-width">
                    <label for="email">
                        Correo electrónico
                    </label>
                    <input
                        type="email"
                        id="email"
                        placeholder="ejemplo@correo.com"
                    >
                </div>


                <div class="form-group">
                    <label for="password">
                        Contraseña
                    </label>
                    <input
                        type="password"
                        id="password"
                        placeholder="Crea una contraseña"
                    >
                </div>


                <div class="form-group">
                    <label for="confirmPassword">
                        Confirmar contraseña
                    </label>
                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Repite tu contraseña"
                    >
                </div>

            </div>


            <button
                type="submit"
                class="register-button"
            >
                Crear cuenta
            </button>


        </form>


        <div class="links">

            ¿Ya tienes una cuenta?

            <a href="login.html">
                Iniciar sesión
            </a>

        </div>


        <a
            href="inicio.html"
            class="back"
        >
            ← Regresar al inicio
        </a>


    </div>


    <!-- =========================
         JAVASCRIPT
         REDIRECCIÓN DIRECTA
    ========================= -->

    <script>

        const form = document.getElementById("registerForm");

        form.addEventListener("submit", function(event) {

            event.preventDefault();

            // Obtenemos valores ingresados o asignamos valores automáticos si está vacío
            const name = document.getElementById("name").value.trim() || "Usuario Registrado";
            const email = document.getElementById("email").value.trim() || "usuario@ejemplo.com";
            const phone = document.getElementById("phone").value.trim() || "4490000000";

            // Guardamos el perfil en LocalStorage
            const user = {
                name: name,
                email: email,
                phone: phone
            };

            localStorage.setItem(
                "usuarioPalacios",
                JSON.stringify(user)
            );

            // Redirección directa al perfil
            window.location.href = "perfil.html";

        });

    </script>


</body>

</html>
