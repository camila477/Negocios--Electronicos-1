```html
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iniciar sesión | Perforaciones Palacios</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;

            background:
                linear-gradient(
                    rgba(9,48,62,0.82),
                    rgba(9,48,62,0.82)
                ),
                url("imagenes/imagenaforo.jpg")
                center/cover no-repeat;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 30px;
        }

        .login-container {
            width: 100%;
            max-width: 430px;

            background: white;

            padding: 40px;

            border-radius: 15px;

            box-shadow:
                0 20px 50px rgba(0,0,0,0.25);
        }

        /* =========================
           LOGO
        ========================= */

        .logo {
            text-align: center;

            font-size: 25px;

            font-weight: bold;

            color: #155e75;

            margin-bottom: 8px;
        }

        .logo span {
            color: #0ea5e9;
        }

        .subtitle {
            text-align: center;

            color: #607d8b;

            font-size: 14px;

            margin-bottom: 30px;
        }

        h1 {
            text-align: center;

            color: #123b4d;

            font-size: 28px;

            margin-bottom: 25px;
        }

        /* =========================
           FORMULARIO
        ========================= */

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;

            margin-bottom: 7px;

            color: #183b4e;

            font-size: 14px;

            font-weight: bold;
        }

        input {
            width: 100%;

            padding: 13px 14px;

            border: 1px solid #d6e4e9;

            border-radius: 7px;

            outline: none;

            font-size: 15px;

            color: #183b4e;

            transition: 0.3s;
        }

        input:focus {
            border-color: #0ea5e9;

            box-shadow:
                0 0 0 3px rgba(14,165,233,0.12);
        }

        /* =========================
           BOTÓN
        ========================= */

        .login-button {
            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 8px;

            background: #155e75;

            color: white;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }

        .login-button:hover {
            background: #0ea5e9;

            transform: translateY(-2px);
        }

        /* =========================
           MENSAJE
        ========================= */

        .message {
            display: none;

            margin-top: 18px;

            padding: 13px;

            border-radius: 7px;

            text-align: center;

            font-size: 14px;
        }

        .error {
            background: #fee2e2;

            color: #b91c1c;
        }

        .success {
            background: #dcfce7;

            color: #166534;
        }

        /* =========================
           ENLACES
        ========================= */

        .links {
            text-align: center;

            margin-top: 25px;

            font-size: 14px;

            color: #607d8b;

            line-height: 1.8;
        }

        .links a {
            color: #0369a1;

            font-weight: bold;

            text-decoration: none;
        }

        .links a:hover {
            text-decoration: underline;
        }

        .back {
            display: block;

            text-align: center;

            margin-top: 18px;

            color: #607d8b;

            text-decoration: none;

            font-size: 13px;
        }

        .back:hover {
            color: #0ea5e9;
        }

        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 500px) {

            body {
                padding: 20px;
            }

            .login-container {
                padding: 30px 25px;
            }

        }

    </style>

</head>


<body>


    <div class="login-container">


        <div class="logo">
            Perforaciones <span>Palacios</span>
        </div>

        <div class="subtitle">
            Soluciones profesionales en perforación de pozos
        </div>


        <h1>
            Iniciar sesión
        </h1>


        <!-- =========================
             FORMULARIO LOGIN
        ========================= -->

        <form id="loginForm">


            <div class="form-group">

                <label for="email">
                    Correo electrónico
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="ejemplo@correo.com"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Contraseña
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Ingresa tu contraseña"
                    required
                >

            </div>


            <button
                type="submit"
                class="login-button"
            >
                Iniciar sesión
            </button>


        </form>


        <div
            id="message"
            class="message"
        >
        </div>


        <div class="links">

            ¿No tienes una cuenta?

            <a href="registro.html">
                Crear cuenta
            </a>

        </div>


        <a
            href="inicio.html"
            class="back"
        >
            ← Regresar al inicio
        </a>


    </div>


    <!-- =========================
         JAVASCRIPT
         LOGIN SIMULADO
    ========================= -->

    <script>

        const form = document.getElementById("loginForm");

        const message = document.getElementById("message");


        form.addEventListener("submit", function(event) {

            event.preventDefault();


            const email =
                document.getElementById("email").value;

            const password =
                document.getElementById("password").value;


            /* =========================
               OBTENER USUARIO
               DEL LOCALSTORAGE
            ========================= */

            const savedUser =
                localStorage.getItem("usuarioPalacios");


            /* =========================
               COMPROBAR SI EXISTE
            ========================= */

            if (!savedUser) {

                message.style.display = "block";

                message.className =
                    "message error";

                message.innerText =
                    "No existe un usuario registrado. Primero crea una cuenta.";

                return;
            }


            const user =
                JSON.parse(savedUser);


            /* =========================
               VALIDAR DATOS
            ========================= */

            if (
                email === user.email &&
                password === user.password
            ) {


                /* =========================
                   CREAR SESIÓN SIMULADA
                ========================= */

                localStorage.setItem(
                    "sesionPalacios",
                    "activa"
                );


                message.style.display = "block";

                message.className =
                    "message success";

                message.innerText =
                    "Inicio de sesión correcto. Redirigiendo...";


                /* =========================
                   IR AL PERFIL
                ========================= */

                setTimeout(function() {

                    window.location.href =
                        "perfil.html";

                }, 1200);


            } else {

                message.style.display = "block";

                message.className =
                    "message error";

                message.innerText =
                    "Correo o contraseña incorrectos.";

            }

        });

    </script>


</body>

</html>
